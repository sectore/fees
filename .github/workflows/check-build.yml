name: Check build

on:
  push:
    branches: [main]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop --command bash -c 'pnpm install --frozen-lockfile'

      - name: Type check
        run: nix develop --command bash -c 'pnpm check'

      - name: Lint
        run: nix develop --command bash -c 'pnpm lint:ci'

      - name: Check formatting
        run: nix develop --command bash -c 'pnpm format:check'

      - name: Run tests
        run: nix develop --command bash -c 'pnpm test'

      - name: Build
        run: nix develop --command bash -c 'pnpm build'
